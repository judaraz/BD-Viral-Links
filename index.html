    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

    <script>
        // ============================================
        // FIREBASE CONFIG
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBEvTvWy-hH1HHgjoOhUKkj-Dglm11Oc8U",
            authDomain: "cash-rewards-01-624ae.firebaseapp.com",
            projectId: "cash-rewards-01-624ae",
            storageBucket: "cash-rewards-01-624ae.firebasestorage.app",
            messagingSenderId: "29119912449",
            appId: "1:29119912449:web:e0c68c1994ff0a71603e00"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================
        // ADSGRAM CONFIGURATION
        // ============================================
        const ADSGRAM_CONFIG = {
            rewardedBlockId: "42429",
            interstitialBlockId: "int-27569",
            adTimeout: 30000
        };

        // ============================================
        // SIMPLE AD MANAGER - GUARANTEED TO SHOW ADS
        // ============================================
        class SimpleAdManager {
            constructor() {
                this.adCallCount = 0;
                this.currentAdType = 'rewarded';
                this.isShowing = false;
                this.currentResolve = null;
                this.adContainer = null;
            }

            // Main method to show an ad
            showAd() {
                return new Promise((resolve) => {
                    this.currentResolve = resolve;
                    
                    // Alternate between rewarded and interstitial
                    this.adCallCount++;
                    this.currentAdType = (this.adCallCount % 2 === 1) ? 'rewarded' : 'interstitial';
                    
                    console.log(`📺 Showing ${this.currentAdType.toUpperCase()} ad (Call #${this.adCallCount})`);
                    
                    // Check if Adsgram SDK is loaded
                    if (!window.sad) {
                        console.warn('⚠️ Adsgram SDK not loaded, using demo ad');
                        this.showDemoAd();
                        return;
                    }
                    
                    // Show real ad
                    this.showRealAd();
                });
            }

            // Show real Adsgram ad
            showRealAd() {
                const isRewarded = this.currentAdType === 'rewarded';
                const blockId = isRewarded ? ADSGRAM_CONFIG.rewardedBlockId : ADSGRAM_CONFIG.interstitialBlockId;
                
                // Create ad UI
                this.createAdUI(isRewarded);
                
                // Get user ID
                const userId = window.currentUser?.uid || 'guest_user';
                
                try {
                    console.log(`🔵 Creating ad with block ID: ${blockId}`);
                    
                    window.sad.createAd({
                        blockId: blockId,
                        type: isRewarded ? 'rewarded' : 'interstitial',
                        userId: userId,
                        
                        onAdLoaded: () => {
                            console.log('✅ Ad loaded successfully');
                            this.hideLoading();
                        },
                        
                        onAdStarted: () => {
                            console.log('▶️ Ad started playing');
                        },
                        
                        onAdCompleted: (data) => {
                            console.log('🎉 Ad completed:', data);
                            this.handleAdComplete(true);
                        },
                        
                        onAdError: (error) => {
                            console.error('❌ Ad error:', error);
                            this.handleAdError(error);
                        },
                        
                        onAdClosed: () => {
                            console.log('🔒 Ad closed');
                            this.handleAdComplete(false);
                        }
                    });
                    
                    // Set timeout
                    setTimeout(() => {
                        if (this.isShowing) {
                            console.log('⏰ Ad timeout');
                            this.handleAdComplete(false);
                        }
                    }, ADSGRAM_CONFIG.adTimeout);
                    
                } catch (error) {
                    console.error('❌ Error creating ad:', error);
                    this.showDemoAd();
                }
            }

            // Create ad UI overlay
            createAdUI(isRewarded) {
                // Remove existing ad
                this.removeAdUI();
                
                const adType = isRewarded ? 'Rewarded Ad' : 'Interstitial Ad';
                const badgeClass = isRewarded ? 'ad-badge-rewarded' : 'ad-badge-interstitial';
                
                const overlay = document.createElement('div');
                overlay.className = 'ad-overlay';
                overlay.id = 'adOverlay';
                overlay.innerHTML = `
                    <div class="ad-wrapper">
                        <div class="ad-header">
                            <span class="ad-badge ${badgeClass}">🎬 ${adType}</span>
                            <button class="ad-close-btn" onclick="window.adManager.closeAd()">✕</button>
                        </div>
                        <div class="ad-content" id="adContent">
                            <div class="ad-loading-container" id="adLoading">
                                <div class="ad-loading-spinner"></div>
                                <p>Loading ad...</p>
                            </div>
                            <div id="adUnit" style="width:100%;height:100%;position:absolute;top:0;left:0;"></div>
                        </div>
                        <div class="ad-footer">
                            <span class="ad-timer" id="adTimer">⏱️ 0s</span>
                            <button class="ad-skip-btn" id="adSkipBtn" disabled>Skip in 5s</button>
                        </div>
                    </div>
                `;
                
                document.body.appendChild(overlay);
                this.adContainer = overlay;
                this.isShowing = true;
                
                // Start timer
                this.startTimer(isRewarded);
            }

            // Start ad timer
            startTimer(isRewarded) {
                let seconds = 0;
                const timerEl = document.getElementById('adTimer');
                const skipBtn = document.getElementById('adSkipBtn');
                
                this.timerInterval = setInterval(() => {
                    seconds++;
                    if (timerEl) timerEl.textContent = `⏱️ ${seconds}s`;
                    
                    // Enable skip after 5 seconds for interstitial
                    if (seconds >= 5 && skipBtn && skipBtn.disabled) {
                        skipBtn.disabled = false;
                        skipBtn.textContent = 'Skip Ad ⏭️';
                        skipBtn.onclick = () => this.skipAd();
                    }
                }, 1000);
            }

            // Hide loading indicator
            hideLoading() {
                const loadingEl = document.getElementById('adLoading');
                if (loadingEl) loadingEl.style.display = 'none';
            }

            // Handle ad completion
            handleAdComplete(completed) {
                this.cleanup();
                if (this.currentResolve) {
                    this.currentResolve(completed);
                    this.currentResolve = null;
                }
                this.removeAdUI();
            }

            // Handle ad error
            handleAdError(error) {
                console.log('⚠️ Ad error, falling back to demo');
                this.cleanup();
                this.removeAdUI();
                this.showDemoAd();
            }

            // Skip ad
            skipAd() {
                console.log('⏭️ Ad skipped by user');
                this.handleAdComplete(false);
            }

            // Close ad
            closeAd() {
                console.log('✕ Ad closed by user');
                this.handleAdComplete(false);
            }

            // Show demo ad (fallback)
            showDemoAd() {
                alert('📺 Demo Ad Completed! You earned bonus rewards!');
                if (this.currentResolve) {
                    this.currentResolve(true);
                    this.currentResolve = null;
                }
                this.cleanup();
            }

            // Cleanup intervals
            cleanup() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
                this.isShowing = false;
            }

            // Remove ad UI
            removeAdUI() {
                if (this.adContainer) {
                    this.adContainer.remove();
                    this.adContainer = null;
                }
                const existingOverlay = document.getElementById('adOverlay');
                if (existingOverlay) {
                    existingOverlay.remove();
                }
            }
        }

        // ============================================
        // GLOBAL VARIABLES
        // ============================================
        window.currentUser = null;
        let userData = null;
        let telegramUser = null;
        let currentLudoWin = 0;
        let isRolling = false;
        let ludoDisabledUntil = 0;
        let colorGameTarget = null;
        let tryLuckBaseReward = 100;
        
        // Create ad manager instance (global for access from HTML)
        window.adManager = new SimpleAdManager();

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.style.display = show ? 'flex' : 'none';
        }
        
        function showAlert(msg) {
            alert(msg);
        }
        
        window.closeRewardModal = function() {
            const modal = document.getElementById('rewardModal');
            if (modal) modal.style.display = 'none';
        };
        
        window.closeDiceModal = function() {
            const modal = document.getElementById('diceModal');
            if (modal) modal.style.display = 'none';
        };
        
        function showRewardModal(title, amount, msg, onBase, onBonus) {
            const modal = document.getElementById('rewardModal');
            if (!modal) return;
            
            document.getElementById('rewardModalTitle').textContent = title;
            document.getElementById('rewardAmount').textContent = `+${amount} Points`;
            document.getElementById('rewardMessage').textContent = msg;
            
            const baseBtn = document.getElementById('claimBaseBtn');
            const bonusBtn = document.getElementById('claimBonusBtn');
            
            if (baseBtn) baseBtn.onclick = () => { closeRewardModal(); onBase(); };
            if (bonusBtn) bonusBtn.onclick = () => { closeRewardModal(); onBonus(); };
            
            modal.style.display = 'flex';
        }
        
        function showDiceModal(amount, onBase, onBonus) {
            const modal = document.getElementById('diceModal');
            if (!modal) return;
            
            document.getElementById('diceWinAmount').textContent = `${amount} Points`;
            
            const baseBtn = document.getElementById('diceClaimBaseBtn');
            const bonusBtn = document.getElementById('diceClaimBonusBtn');
            
            if (baseBtn) baseBtn.onclick = () => { closeDiceModal(); onBase(); };
            if (bonusBtn) bonusBtn.onclick = () => { closeDiceModal(); onBonus(); };
            
            modal.style.display = 'flex';
        }

        // ============================================
        // SHOW AD FUNCTION
        // ============================================
        async function showOptionalBonusAd() {
            console.log('🎯 Requesting ad...');
            
            try {
                const result = await window.adManager.showAd();
                console.log('📊 Ad result:', result ? 'COMPLETED ✅' : 'SKIPPED/FAILED ❌');
                return result;
            } catch (error) {
                console.error('❌ Ad error:', error);
                return false;
            }
        }
        
        // ============================================
        // BALANCE FUNCTIONS
        // ============================================
        async function updateBalance(amount, reason) {
            if (!userData) return false;
            
            userData.balance = (userData.balance || 0) + amount;
            if (amount > 0) {
                userData.totalEarned = (userData.totalEarned || 0) + amount;
                userData.todayEarnings = (userData.todayEarnings || 0) + amount;
            }
            
            if (userData.userType === 'telegram' && window.currentUser) {
                try {
                    await db.collection('users').doc(window.currentUser.uid).update({
                        balance: userData.balance,
                        totalEarned: firebase.firestore.FieldValue.increment(amount > 0 ? amount : 0),
                        todayEarnings: firebase.firestore.FieldValue.increment(amount > 0 ? amount : 0)
                    });
                } catch(e) { 
                    console.log("Firebase update error:", e); 
                }
            } else {
                localStorage.setItem('browserUserData', JSON.stringify(userData));
            }
            
            updateUI();
            return true;
        }
        
        async function deductBalance(amount) {
            if ((userData?.balance || 0) < amount) return false;
            await updateBalance(-amount, 'game_cost');
            return true;
        }
        
        function updateUI() {
            if (userData) {
                const balanceEl = document.getElementById('balance');
                const walletEl = document.getElementById('walletBalance');
                const todayEl = document.getElementById('todayEarnings');
                const levelEl = document.getElementById('userLevel');
                const totalEl = document.getElementById('totalEarned');
                
                if (balanceEl) balanceEl.textContent = (userData.balance || 0).toFixed(0);
                if (walletEl) walletEl.textContent = (userData.balance || 0).toFixed(0);
                if (todayEl) todayEl.textContent = (userData.todayEarnings || 0).toFixed(0);
                
                const level = Math.floor((userData.totalEarned || 0) / 1000) + 1;
                if (levelEl) levelEl.textContent = level;
                if (totalEl) totalEl.textContent = (userData.totalEarned || 0).toFixed(0);
            }
        }
        
        // ============================================
        // LUDO GAME
        // ============================================
        async function rollDice() {
            if (isRolling) return;
            
            const now = Date.now();
            if (now < ludoDisabledUntil) {
                showAlert(`Please wait ${Math.ceil((ludoDisabledUntil - now) / 1000)} seconds`);
                return;
            }
            
            const cost = 10;
            if ((userData?.balance || 0) < cost) {
                showAlert(`You need ${cost} points to play!`);
                return;
            }
            
            await deductBalance(cost);
            isRolling = true;
            const rollBtn = document.getElementById('rollDiceBtn');
            if (rollBtn) rollBtn.disabled = true;
            
            let rolls = 0;
            const totalRolls = 12;
            const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            
            function animate() {
                if (rolls < totalRolls) {
                    const diceEl = document.getElementById('ludoDice');
                    if (diceEl) diceEl.textContent = diceFaces[Math.floor(Math.random() * 6)];
                    rolls++;
                    setTimeout(animate, 80);
                } else {
                    const result = Math.floor(Math.random() * 6) + 1;
                    currentLudoWin = result * 10;
                    const diceEl = document.getElementById('ludoDice');
                    if (diceEl) diceEl.textContent = diceFaces[result - 1];
                    
                    showDiceModal(
                        currentLudoWin,
                        async () => {
                            await updateBalance(currentLudoWin, 'ludo_base');
                            showAlert(`🎉 You won ${currentLudoWin} points!`);
                            setCooldown();
                        },
                        async () => {
                            showLoading(true);
                            const adWatched = await showOptionalBonusAd();
                            showLoading(false);
                            
                            if (adWatched) {
                                const bonus = currentLudoWin * 2;
                                await updateBalance(bonus, 'ludo_bonus');
                                showAlert(`🎉 You won ${bonus} points with 2x bonus!`);
                            } else {
                                await updateBalance(currentLudoWin, 'ludo_base');
                                showAlert(`⚠️ You received ${currentLudoWin} points.`);
                            }
                            setCooldown();
                        }
                    );
                    
                    isRolling = false;
                    if (rollBtn) rollBtn.disabled = false;
                }
            }
            
            function setCooldown() {
                ludoDisabledUntil = Date.now() + 10000;
                const cooldownEl = document.getElementById('ludoCooldown');
                if (cooldownEl) {
                    cooldownEl.classList.remove('hidden');
                    setTimeout(() => cooldownEl.classList.add('hidden'), 10000);
                }
            }
            
            animate();
        }
        
        // ============================================
        // COLOR GAME
        // ============================================
        function initColorGame() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            colorGameTarget = `rgb(${r}, ${g}, ${b})`;
            
            const targetColorEl = document.getElementById('targetColor');
            const targetRgbEl = document.getElementById('targetRgb');
            if (targetColorEl) targetColorEl.style.backgroundColor = colorGameTarget;
            if (targetRgbEl) targetRgbEl.textContent = colorGameTarget;
            
            const options = [colorGameTarget];
            while (options.length < 9) {
                const diff = 40 + Math.floor(Math.random() * 60);
                const r2 = Math.max(0, Math.min(255, r + (Math.random() > 0.5 ? diff : -diff)));
                const g2 = Math.max(0, Math.min(255, g + (Math.random() > 0.5 ? diff : -diff)));
                const b2 = Math.max(0, Math.min(255, b + (Math.random() > 0.5 ? diff : -diff)));
                const color = `rgb(${r2}, ${g2}, ${b2})`;
                if (!options.includes(color)) options.push(color);
            }
            
            options.sort(() => Math.random() - 0.5);
            
            const container = document.getElementById('colorOptions');
            if (container) {
                container.innerHTML = '';
                options.forEach(color => {
                    const div = document.createElement('div');
                    div.className = 'color-option';
                    div.style.backgroundColor = color;
                    div.onclick = () => checkColorMatch(color);
                    container.appendChild(div);
                });
            }
        }
        
        async function checkColorMatch(selected) {
            const reward = 50;
            
            if (selected === colorGameTarget) {
                showRewardModal(
                    '🎨 Correct!', reward,
                    'You matched the color!',
                    async () => {
                        await updateBalance(reward, 'color_base');
                        showAlert(`🎉 You earned ${reward} points!`);
                        initColorGame();
                    },
                    async () => {
                        showLoading(true);
                        const adWatched = await showOptionalBonusAd();
                        showLoading(false);
                        
                        if (adWatched) {
                            const bonus = reward * 2;
                            await updateBalance(bonus, 'color_bonus');
                            showAlert(`🎉 You earned ${bonus} points with 2x bonus!`);
                        } else {
                            await updateBalance(reward, 'color_base');
                            showAlert(`⚠️ You received ${reward} points.`);
                        }
                        initColorGame();
                    }
                );
            } else {
                showAlert('❌ Wrong color! Try again!');
                initColorGame();
            }
        }
        
        // ============================================
        // TRY YOUR LUCK
        // ============================================
        function initTryLuck() {
            tryLuckBaseReward = 100;
            const rewardEl = document.getElementById('tryLuckBaseReward');
            if (rewardEl) rewardEl.textContent = `${tryLuckBaseReward} Points`;
        }
        
        async function startTryLuck() {
            showRewardModal(
                '🎰 Try Your Luck!', tryLuckBaseReward,
                'Get your reward!',
                async () => {
                    await updateBalance(tryLuckBaseReward, 'tryluck_base');
                    showAlert(`🎉 You earned ${tryLuckBaseReward} points!`);
                },
                async () => {
                    showLoading(true);
                    const adWatched = await showOptionalBonusAd();
                    showLoading(false);
                    
                    if (adWatched) {
                        const bonus = tryLuckBaseReward * 2;
                        await updateBalance(bonus, 'tryluck_bonus');
                        showAlert(`🎉 You earned ${bonus} points with 2x bonus!`);
                    } else {
                        await updateBalance(tryLuckBaseReward, 'tryluck_base');
                        showAlert(`⚠️ You received ${tryLuckBaseReward} points.`);
                    }
                }
            );
        }
        
        // ============================================
        // NAVIGATION
        // ============================================
        window.showPage = function(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const page = document.getElementById(pageId);
            if (page) page.classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === pageId);
            });
            
            if (pageId === 'colorGamePage') initColorGame();
            if (pageId === 'tryLuckPage') initTryLuck();
        };
        
        // ============================================
        // GAMES GRID
        // ============================================
        function buildGamesGrid() {
            const games = [
                { id: 'ludoPage', name: '🎲 Ludo Dice', desc: 'Roll & Win!', icon: 'fa-dice-d6', color: 'from-yellow-400 to-orange-500' },
                { id: 'colorGamePage', name: '🎨 Color Match', desc: 'Match Colors', icon: 'fa-palette', color: 'from-pink-400 to-purple-500' },
                { id: 'tryLuckPage', name: '🎰 Try Luck', desc: 'Bonus Rewards', icon: 'fa-star', color: 'from-purple-400 to-pink-500' },
                { id: 'offerwallPage', name: '🎁 Offers', desc: 'Earn More', icon: 'fa-gift', color: 'from-blue-400 to-cyan-500' }
            ];
            
            const container = document.getElementById('gamesGrid');
            if (container) {
                container.innerHTML = games.map(game => `
                    <div onclick="showPage('${game.id}')" class="game-card text-center cursor-pointer">
                        <div class="game-icon bg-gradient-to-r ${game.color} mx-auto">
                            <i class="fas ${game.icon} text-white"></i>
                        </div>
                        <h4 class="font-bold text-sm">${game.name}</h4>
                        <p class="text-xs text-gray-400">${game.desc}</p>
                    </div>
                `).join('');
            }
        }
        
        // ============================================
        // INITIALIZATION
        // ============================================
        async function initTelegramUser() {
            if (window.Telegram?.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                telegramUser = tg.initDataUnsafe?.user;
            }
            
            if (telegramUser) {
                const userId = `tg_${telegramUser.id}`;
                try {
                    const userSnap = await db.collection('users').doc(userId).get();
                    
                    if (userSnap.exists) {
                        userData = userSnap.data();
                    } else {
                        const referralCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                        userData = {
                            uid: userId,
                            name: telegramUser.first_name || 'Telegram User',
                            email: `${telegramUser.id}@telegram.user`,
                            balance: 100,
                            referralCode: referralCode,
                            referredBy: null,
                            createdAt: new Date(),
                            totalEarned: 0,
                            todayEarnings: 0,
                            userType: 'telegram'
                        };
                        await db.collection('users').doc(userId).set(userData);
                    }
                    window.currentUser = { uid: userId };
                } catch(e) {
                    console.log("Using local storage fallback");
                    userData = {
                        name: telegramUser.first_name || 'Telegram User',
                        balance: 100,
                        referralCode: 'DEMO123',
                        totalEarned: 0,
                        todayEarnings: 0,
                        userType: 'telegram'
                    };
                    window.currentUser = { uid: userId };
                }
            } else {
                const saved = localStorage.getItem('browserUserData');
                if (saved) {
                    userData = JSON.parse(saved);
                } else {
                    userData = {
                        name: 'Guest User',
                        email: 'guest@user.com',
                        balance: 100,
                        referralCode: 'GUEST' + Math.floor(Math.random() * 10000),
                        totalEarned: 0,
                        todayEarnings: 0,
                        userType: 'browser'
                    };
                    localStorage.setItem('browserUserData', JSON.stringify(userData));
                }
                window.currentUser = { uid: 'browser_user' };
            }
            
            const userNameEl = document.getElementById('userName');
            if (userNameEl) userNameEl.textContent = `Hi, ${(userData.name || 'User').split(' ')[0]}`;
            updateUI();
        }
        
        async function init() {
            showLoading(true);
            
            console.log('========================================');
            console.log('🎮 CashReward Premium');
            console.log('🔵 Adsgram SDK:', window.sad ? 'Loaded ✅' : 'Not Loaded ❌');
            console.log('🎁 Rewarded ID: 42429 | 📢 Interstitial ID: int-27569');
            console.log('🔄 Mode: Alternating Ads');
            console.log('========================================');
            
            await initTelegramUser();
            buildGamesGrid();
            setupEventListeners();
            showLoading(false);
            showPage('homePage');
        }
        
        function setupEventListeners() {
            const rollBtn = document.getElementById('rollDiceBtn');
            const luckBtn = document.getElementById('startTryLuckBtn');
            
            if (rollBtn) rollBtn.addEventListener('click', rollDice);
            if (luckBtn) luckBtn.addEventListener('click', startTryLuck);
            
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => showPage(item.dataset.page));
            });
        }
        
        // Start the app
        init();
    </script>
